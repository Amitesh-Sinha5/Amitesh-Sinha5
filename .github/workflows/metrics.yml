name: Generate metrics card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Self-hosted on purpose. The popular shared cards
      # (github-readme-stats, profile-summary-cards, profile-trophy) all run on
      # free Vercel instances that routinely return 503/500/402 once their quota
      # is hit — which shows up as broken images on the profile. Generating the
      # SVG here and committing it means the card is served from this repo and
      # cannot break because someone else's deployment is over quota.
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_output: svg
          output_action: commit
          committer_branch: output

      - name: Language breakdown card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          output_action: commit
          committer_branch: output
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
